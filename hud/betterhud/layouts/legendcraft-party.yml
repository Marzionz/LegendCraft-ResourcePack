  texts:
    # TEXT PLACEMENT IS VOLYA'S, not a guess. Their CLASS preset puts the name on the top band
    # and the HP readout CENTRED ON THE HEALTH BAR (`hp_text` / `hp_text_divider` / `hp_text_max`
    # at x 56/58/61 over a bar starting at x 20), and it is the better read for a reason the art
    # makes obvious: right-aligning the readout at the row's end collides with the leader crown,
    # which lives at x 91-98. Nothing but the crown can go there.
    #
    # `outline: true` is BetterHud's text shadow -- `YamlsKt.getShadow` maps the literal `true` to
    # 0xFF000000, opaque black (`false`/absent means none, and any other value is parsed as ARGB
    # hex WITHOUT a leading `#`). It matters here because the readout now sits on the health fill,
    # so it has to stay legible against both red `#C43B2E` and the empty channel `#16181C`.
    # This also corrects `generate_hud.py`'s note that "BetterHud text has no native outline",
    # which is stale for 2.1.0-447; the stat block's own outlined-digit font is left alone.
    #
    # OPEN: `scale: 0.30` is inherited from the stat block and renders about 5px from a font whose
    # source glyphs are 8px, so the name is resampled rather than crisp. Volya avoids this with a
    # pre-outlined replacement font (`volya-outline`, ascii height 7) rather than a bigger size.
    # Sized art beats a scale number here, so this is left as-is until it has been seen in client.
    1:
      name: lc_stat_text
      pattern: "[papi:legendcraft_party_member_1]"
      align: left
      scale: 0.30
      outline: true
      x: 20
      y: 1
      layer: 8
      follow: papi:legendcraft_party_member_1
    2:
      name: lc_stat_text
      pattern: "[papi:legendcraft_health]/[papi:legendcraft_max_health]"
      align: center
      scale: 0.30
      outline: true
      x: 58
      y: 8
      layer: 8
      follow: papi:legendcraft_party_member_1
