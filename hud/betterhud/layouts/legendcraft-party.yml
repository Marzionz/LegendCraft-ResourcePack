# HAND-AUTHORED (not generated) -- party frames, 4 rows, one per party member OTHER than you.
#
# CLASS variant (owner pick, 2026-08-28): each row leads with the member's class identity icon
# rather than their player head. A party frame is read mid-fight to answer "who can heal me" --
# the class answers that, and the name is already spelled out beside it, so the head was carrying
# information the row already had.
#
# Ported from Volya's Party HUD 1.1.0 (MythicHUD) to BetterHud 2.1.0. Chrome + bar art staged by
# `stage_volya_hud.py`; class icons are ours. Registry: `images/legendcraft-party.yml`.
# Registered as layout 2 of `lc_stat_hud` (`generate_hud.py` `_bh_stat_hud_yml`) -- NOT as a second
# hud, because BetterHud only repositions the first default-hud.
#
# HOW A ROW BINDS TO A PLAYER. Every element carries
# `follow: papi:legendcraft_party_member_N`, which BetterHud resolves to a name and then uses as
# the subject for that element's listener, conditions and pattern. With
# `cancel-if-follower-not-exists: true` (the default, left implicit) an unfilled or offline slot
# renders nothing at all -- so the stack sizes itself to the party and no `party_size` gate is
# needed. That is also why this config is inert until LegendCraft-Classes answers the two new
# ids: an unanswered follow resolves to no player and every row simply stays blank.
#
# The class icon is 24 conditioned elements per row, gated on the FOLLOWED member's
# `legendcraft_subclass`. BetterHud cannot pick an image name from a placeholder, so an enumerated
# set is the only shape available -- the same one the live skill row already uses for its per-class
# ability art. A classless member (`subclass` returns "none") matches nothing and shows the bare
# frame, which is correct: they have no class to announce.
#
# FOUR ROWS, NOT FIVE. `PartyService.PARTY_MAX_SIZE` is 5 including yourself, and your own
# vitals are already the stat block above the hotbar. The frames show the other four.
#
# ROW LAYERS (this layout only -- layers do not cross layouts): 1 frame, 2 bar outlines,
# 3 health fill, 4 resource fill, 6 leader crown, 7 class icon. Layer 5 is deliberately left free
# for the class-shield pool overlay, which must sit above the health fill and below the crown; it
# is specified but unbuilt (see `Plans/todo/hud-volya-integration.md`).
#
# Offsets are a first pass placed from the art's own dimensions and are expected to move once they
# have been seen in-client, exactly like STAT_HUD_X/Y were.
lc_party:
  # A DEAD MEMBER'S WHOLE ROW GOES INERT. This block sits on the layout GROUP, so every image and
  # text below inherits it: `HudLayout.Impl` builds each element's condition source as
  # `group.plus(<that element's yaml>)`, and the composed override is invoked with the element's
  # FOLLOWED player -- the same `HudPlayer` `follow` already resolved for its listener and its
  # conditions. One block therefore dims all four rows against each row's own member, and it
  # cannot reach the stat block, which is a different layout group.
  #
  # WHY NO `is_dead` PLACEHOLDER. `legendcraft_health` is a whole number captured with
  # `Math.ceil`, so it reads "0" if and only if the member's health is actually <= 0 -- a member
  # at 0.4 HP still reads "1" and stays lit. An absent snapshot reads empty rather than "0", so a
  # member mid-disconnect does not flash dim on the way out. The gate needs nothing the plugin
  # does not already answer.
  #
  # THE VALUE IS THE LOCKED-SLOT TRANSFORM, not Volya's flat `#787878`. `hud-and-icons.md` §3
  # ("Ultimate extras") renders an unavailable ability as `brightness(..., 0.42, blue_shift=14)`,
  # and a dead party member is the same reading: still in the row, not available. 0.42 x 255 =
  # 107 (`#6B`), blue lifted 14 to `#79`. Reusing it gives the HUD one dimming vocabulary instead
  # of two that mean the same thing.
  #
  # It is the brightness-and-temperature half of that transform ONLY. BetterHud multiplies the
  # glyph by a single `TextColor` (`AdventuresKt.applyColor`), so the desaturate step cannot be
  # expressed here and the row keeps its hue at 42%. That is still enough separation, because the
  # two states differ on two axes rather than one: a living low-health member is full brightness
  # AND has red left in the bar, a dead one is dimmed AND empty.
  #
  # `default-color` is deliberately NOT set. `ColorOverride.Companion.builder` iterates every key
  # of this block and reads each value as an object, so a scalar sibling would be parsed as a
  # malformed entry rather than as a default. It is not needed: an unmatched row yields a null
  # colour, and `applyColor` returns the component untouched for null.
  color-overrides:
    dead:
      color: "#6B6B79"
      conditions:
        1:
          first: "papi:legendcraft_health"
          second: "'0'"
          operation: '=='
