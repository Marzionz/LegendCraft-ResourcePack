# CI for LegendCraft-ResourcePack: the gates over the runtime HUD configuration this repo
# serves. The placeholder gate reads LegendCraft-Classes' expansion source from a sibling
# checkout, so it needs LEGENDCRAFT_REPO_TOKEN, a PAT scoped to that repo's contents: it is
# private and this workflow's own GITHUB_TOKEN cannot read another repository. The gate fails
# rather than degrading when it cannot read that source -- a copied list is not the contract.
name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

# Every push runs to completion, so a tests-only push keeps its red run when the
# implementation push follows seconds later; same-branch runs queue instead of cancelling.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    # GitHub-hosted, not the self-hosted label the sibling plugin repos use. This repository is
    # public, and a self-hosted runner would put its CI on the machine that also hosts the
    # private repos' runners and the development server. Nothing here needs that machine:
    # these gates are Python and PowerShell over text.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: LegendCraft-ResourcePack

      - name: Check out LegendCraft-Classes (the placeholder contract's other side)
        uses: actions/checkout@v4
        with:
          repository: Marzionz/LegendCraft-Classes
          token: ${{ secrets.LEGENDCRAFT_REPO_TOKEN }}
          path: LegendCraft-Classes

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the generator's dependencies
        working-directory: LegendCraft-ResourcePack
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      # Gate 1. The BetterHud YAML, the shared chrome art and the flipbook frames are generated.
      # A hand edit to any of them survives review looking like content and is erased by the next
      # regeneration, so the tree has to equal what the generators write.
      - name: Gate - generator drift
        working-directory: LegendCraft-ResourcePack
        run: |
          python tools/generate_hud.py
          python tools/gen-flipbook-frames.py
          python tools/check_generator_drift.py

      - name: Gate - generator acceptance suite
        working-directory: LegendCraft-ResourcePack/tools
        run: python test_generate_hud.py

      # The skill-card sprites and marks font are generated from the approved ornament art; the
      # suite regenerates them into a scratch tree and compares against src/.
      - name: Gate - skill card generator acceptance suite
        working-directory: LegendCraft-ResourcePack/tools
        run: python test_generate_skill_cards.py

      # Gate 2. Every placeholder the HUD reads is one the plugin answers, read from the
      # expansion's own source rather than a copied list.
      - name: Gate - placeholder audit
        working-directory: LegendCraft-ResourcePack
        run: python tools/check_hud_placeholders.py --classes-root ../LegendCraft-Classes

      - name: Gate - placeholder audit acceptance suite
        working-directory: LegendCraft-ResourcePack
        run: python tools/test_hud_placeholders.py

      # Gate 3. The files parse and hold the invariants the generator writes them under --
      # including the one BetterHud's text parser imposes on every `pattern:` in the tree.
      - name: Gate - BetterHud YAML shape
        working-directory: LegendCraft-ResourcePack
        run: python tools/check_hud_yaml.py

      - name: Gate - BetterHud YAML acceptance suite
        working-directory: LegendCraft-ResourcePack
        run: python tools/test_hud_yaml.py

      # Gate 4. The merge that produces the served pack does not silently drop what its inputs
      # put in. Run over fixtures the suite builds, since the plugin build zips only exist on
      # the server box.
      - name: Gate - pack manifest
        working-directory: LegendCraft-ResourcePack
        run: python tools/test_pack_manifest.py

      # The merged pack's manifest is ours, copied through the merge verbatim, so the format
      # triple the client needs can be audited here without any of the merge's inputs.
      - name: Gate - the shipped pack.mcmeta declares a format range
        working-directory: LegendCraft-ResourcePack
        run: python tools/check_pack_manifest.py --manifest-only

      # The served pack claims no client format it was not tested on: the merge bounds every
      # range the plugin packs declare.
      - name: Gate - merge format bound
        working-directory: LegendCraft-ResourcePack
        run: python tools/test_merge_dev_pack.py

      # No overlay a client from MOJ_IMPORT_REJECTED_FORMAT up applies carries a core shader it
      # cannot compile: one such shader makes the client reject the whole pack.
      - name: Gate - overlay shaders
        working-directory: LegendCraft-ResourcePack
        run: python tools/check_overlay_shaders.py

      - name: Gate - overlay shaders acceptance suite
        working-directory: LegendCraft-ResourcePack
        run: python tools/test_check_overlay_shaders.py

      # The item shader draws any face whose tint carries the ghost mark translucent, so no tint
      # the pack ships may carry it.
      - name: Gate - ghost mark
        working-directory: LegendCraft-ResourcePack
        run: python tools/check_ghost_mark.py

      # The suite compiles and runs the item shaders' ghost code on Mesa's software GL, headless.
      - name: Install a headless GL for the ghost mark suite
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libegl-mesa0 libgl1-mesa-dri
          python -m pip install --disable-pip-version-check moderngl==5.12.0

      - name: Gate - ghost mark acceptance suite
        working-directory: LegendCraft-ResourcePack
        run: python tools/test_check_ghost_mark.py

      # The pack-channel rules: a versioned release is immutable, and promotion is the only
      # path from the dev loop to one.
      - name: Gate - pack pin and promotion
        working-directory: LegendCraft-ResourcePack
        run: pwsh -NoProfile -File tests/run-pack-pin-tests.ps1

      # The HUD deploy's shader-template clear. Unlike the rig stager it asserts nothing
      # Windows-specific -- two named files under a folder -- so the runner grades the same
      # rules that hold at the box.
      - name: Gate - HUD shader-template clear
        working-directory: LegendCraft-ResourcePack
        run: pwsh -NoProfile -File tests/run-hud-shader-clear-tests.ps1

      # tests/run-deploy-rigs-tests.ps1 is deliberately NOT here. It asserts against Windows
      # filesystem semantics the rig stager guards -- drive aliases, reparse points, the
      # bracket-as-wildcard trap in Test-Path -- none of which exist on this runner, so running
      # it here would grade a different set of rules than the ones that hold at the box. It is
      # run on Windows when deploy-rigs.ps1 changes.
