<title>pyro_conflag_rim preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ground:#15110D;--panel:#1F1812;--panel-2:#2A2119;--line:#3A2F24;--ink:#EDE3D3;--ink-dim:#A89881;--accent:#9C6B3A;--accent-hot:#E8C79A;
--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--body);margin:0;min-height:100vh}
header{display:flex;align-items:baseline;gap:20px;padding:14px 22px 0;border-bottom:1px solid var(--line)}
h1{font:700 30px/1 var(--display);margin:0 0 12px;text-transform:uppercase}
h1 small{font:500 13px/1 var(--mono);color:var(--ink-dim);text-transform:none;margin-left:12px}
nav{display:flex;gap:2px;margin-left:auto}
nav button{font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-dim);padding:10px 14px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent-hot);border-bottom-color:var(--accent)}
main{padding:14px 22px 30px;display:grid;gap:14px}
.view{position:relative;background:#0E0B08;border:1px solid var(--line);height:min(58vh,560px)}
.view canvas{display:block;width:100%;height:100%}
.lanes{position:absolute;inset:0;pointer-events:none;display:grid}
.lanes div{padding:10px 14px;font:700 18px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim)}
.hint{position:absolute;top:10px;right:14px;font:400 12px var(--mono);color:var(--ink-dim);pointer-events:none}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);padding:10px 14px}
.controls button,.controls select{font:500 13px var(--mono);background:var(--panel-2);color:var(--ink);border:1px solid var(--line);padding:6px 12px;cursor:pointer}
.controls button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-hot)}
.controls label{font:400 12px var(--mono);color:var(--ink-dim);display:flex;align-items:center;gap:8px}
input[type=range]{width:min(420px,50vw);accent-color:var(--accent)}
.tick{font:500 22px/1 var(--display);color:var(--accent-hot);min-width:9ch;font-variant-numeric:tabular-nums}
.tick small{font:400 12px var(--mono);color:var(--ink-dim);margin-left:6px}
.tl{overflow-x:auto;background:var(--panel);border:1px solid var(--line)}
table{border-collapse:collapse;font:12px var(--mono);min-width:720px;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font:700 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim)}
td:first-child,th:first-child{text-align:left;color:var(--ink-dim)}
td.hl{background:rgba(156,107,58,.25)} td.hid{color:var(--ink-dim);opacity:.5}
[hidden]{display:none!important}
</style>

<header>
  <h1 id="title">Prop preview <small id="sub"></small></h1>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="clip">Clip</button>
    <button role="tab" aria-selected="false" data-tab="turn">Turnaround</button>
  </nav>
</header>
<main>
  <div id="tab-clip">
    <div class="view"><canvas id="c1"></canvas><div class="lanes" id="lanes"></div><div class="hint">drag: orbit · wheel: zoom</div></div>
    <div class="controls" id="controls">
      <button id="play">Pause</button>
      <label><input type="checkbox" id="loop" checked> loop</label>
      <label>speed <select id="speed"><option value="0.15">0.15×</option><option value="0.3">0.3×</option><option value="0.6">0.6×</option><option value="0.3333333333" selected>3 ticks / frame</option><option value="1">1× clip</option></select></label>
      <label>tick <input type="range" id="scrub" min="0" max="10" step="0.05" value="0"></label>
      <div class="tick" id="tickout">t 0.0<small>0 ms</small></div>
    </div>
    <div class="tl"><table id="tltable"></table></div>
  </div>
  <div id="tab-turn" hidden>
    <div class="view"><canvas id="c3"></canvas><div class="hint">auto-rotating · drag: orbit · wheel: zoom</div></div>
    <div class="controls" id="turnControls"><label><input type="checkbox" id="spin" checked> spin</label></div>
  </div>
</main>

  const w = c3.clientWidth, h = c3.clientHeight; if (c3.width !== Math.floor(w*r3.getPixelRatio())) r3.setSize(w, h, false);
  camT.aspect = w/h; camT.updateProjectionMatrix(); r3.render(sceneT, camT);
}

// ---------- tabs ----------
let active = 'clip';
document.querySelectorAll('nav [role=tab]').forEach(b => b.onclick = () => { active = b.dataset.tab;
  document.querySelectorAll('nav [role=tab]').forEach(x => x.setAttribute('aria-selected', String(x===b)));
  for (const t of ['clip','turn']) document.getElementById('tab-'+t).hidden = active !== t; last = performance.now(); });
if (matchMedia('(prefers-reduced-motion: reduce)').matches){ playing = false; document.getElementById('play').textContent = 'Play'; spin.checked = false; }
(function frame(now){ if (active === 'clip') renderClip(now); else renderTurn(); requestAnimationFrame(frame); })(performance.now());
</script>
