<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ground:#15110D;--panel:#1F1812;--panel-2:#2A2119;--line:#3A2F24;--ink:#EDE3D3;--ink-dim:#A89881;--accent:#9C6B3A;--accent-hot:#E8C79A;
--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--body);margin:0;min-height:100vh}
header{display:flex;align-items:baseline;gap:20px;padding:14px 22px 0;border-bottom:1px solid var(--line)}
h1{font:700 30px/1 var(--display);margin:0 0 12px;text-transform:uppercase}
h1 small{font:500 13px/1 var(--mono);color:var(--ink-dim);text-transform:none;margin-left:12px}
nav{display:flex;gap:2px;margin-left:auto}
nav button{font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-dim);padding:10px 14px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent-hot);border-bottom-color:var(--accent)}
main{grid-template-columns:minmax(0,1fr);padding:14px 22px 30px;display:grid;gap:14px}
.view{position:relative;background:#0E0B08;border:1px solid var(--line);height:min(58vh,560px)}
.view canvas{display:block;width:100%;height:100%}
.lanes{position:absolute;inset:0;pointer-events:none;display:grid}
.lanes div{padding:10px 14px;font:700 18px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim)}
.hint{position:absolute;top:10px;right:14px;font:400 12px var(--mono);color:var(--ink-dim);pointer-events:none}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);padding:10px 14px}
.controls button,.controls select{font:500 13px var(--mono);background:var(--panel-2);color:var(--ink);border:1px solid var(--line);padding:6px 12px;cursor:pointer}
.controls button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-hot)}
.controls label{font:400 12px var(--mono);color:var(--ink-dim);display:flex;align-items:center;gap:8px}
input[type=range]{width:min(420px,50vw);accent-color:var(--accent)}
.tick{font:500 22px/1 var(--display);color:var(--accent-hot);min-width:9ch;font-variant-numeric:tabular-nums}
.tick small{font:400 12px var(--mono);color:var(--ink-dim);margin-left:6px}
.tl{overflow-x:auto;background:var(--panel);border:1px solid var(--line)}
table{border-collapse:collapse;font:12px var(--mono);min-width:720px;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font:700 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim)}
td:first-child,th:first-child{text-align:left;color:var(--ink-dim)}
td.hl{background:rgba(156,107,58,.25)} td.hid{color:var(--ink-dim);opacity:.5}
[hidden]{display:none!important}
</style>

  const [u1,v1,u2,v2] = uv, a = g.attributes.uv;
  const U1=u1/texW, U2=u2/texW, V1=1-v1/texH, V2=1-v2/texH;
  a.setXY(0,U1,V1); a.setXY(1,U2,V1); a.setXY(2,U1,V2); a.setXY(3,U2,V2);
  const m = new THREE.Mesh(g, mat); m.position.set(pos[0]*U, pos[1]*U, pos[2]*U); m.rotation.set(...rot);
  return m;
}
function buildRig(F){
  const mats = F.textures.map(t => new THREE.MeshBasicMaterial({ map: tex(t), transparent:true, side:THREE.DoubleSide, depthWrite:false, alphaTest:0.02 }));
  const bones = {}, byName = {};
  for (const [id,b] of Object.entries(F.bones)){ const g = new THREE.Group(); g.name = b.name; bones[id] = g; byName[b.name] = g; }
  let root = null;
  for (const [id,b] of Object.entries(F.bones)){
    const g = bones[id];
    if (b.parent){ const p = F.bones[b.parent]; bones[b.parent].add(g); g.position.set((b.origin[0]-p.origin[0])*U,(b.origin[1]-p.origin[1])*U,(b.origin[2]-p.origin[2])*U); }
    else { g.position.set(b.origin[0]*U,b.origin[1]*U,b.origin[2]*U); root = root || g; }
    g.rotation.set(...b.rot.map(THREE.MathUtils.degToRad));
    g.userData.rest = g.position.clone();
  }
  const elById = Object.fromEntries(F.elements.map(e=>[e.uuid,e]));
  for (const [id,b] of Object.entries(F.bones)){
    for (const cid of b.children){ const el = elById[cid]; if (!el) continue;
      const eg = new THREE.Group(); const o = el.origin;
      for (const [face, f] of Object.entries(el.faces)){
        const m = facePlane(el, face, f.uv, F.res.width, F.res.height, mats[f.tex] || mats[0]); if (!m) continue;
        m.position.x -= o[0]*U; m.position.y -= o[1]*U; m.position.z -= o[2]*U; eg.add(m);
      }
      eg.position.set((o[0]-b.origin[0])*U, (o[1]-b.origin[1])*U, (o[2]-b.origin[2])*U);
      eg.rotation.set(...el.rot.map(THREE.MathUtils.degToRad));
      bones[id].add(eg);
    }
  }
  const holder = new THREE.Group(); holder.add(root);
  return { root: holder, bones: byName, data: F };
}
function box(w,h,d,color){ return new THREE.Mesh(new THREE.BoxGeometry(w*U,h*U,d*U), new THREE.MeshLambertMaterial({color})); }
function mannequin(skin, shirt, pants){
  const g = new THREE.Group();
  const parts = [[8,8,8,skin,0,28,0],[8,12,4,shirt,0,18,0],[4,12,4,shirt,6,18,0],[4,12,4,shirt,-6,18,0],[4,12,4,pants,2,6,0],[4,12,4,pants,-2,6,0]];
  for (const [w,h,d,c,x,y,z] of parts){ const m = box(w,h,d,c); m.position.set(x*U,y*U,z*U); g.add(m); }
  return g;
}
function dress(scene){
  scene.add(new THREE.AmbientLight(0xffffff, 0.55)); const l = new THREE.DirectionalLight(0xffe8c8, 0.7); l.position.set(3,6,2); scene.add(l);
  scene.background=new THREE.Color(0x151923); const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshBasicMaterial({color:0x777777,side:THREE.DoubleSide}));floor.rotation.x=-Math.PI/2;floor.position.y=-.002;scene.add(floor);
  const grid = new THREE.GridHelper(8, 8, 0x888888, 0x808080); grid.position.y = -0.001; scene.add(grid);
}
function orbit(canvas, cam, target, r0, yaw0, pitch0){
  const s = { r:r0, yaw:yaw0, pitch:pitch0, drag:false, lx:0, ly:0 };
  function apply(){ cam.position.set(target.x + s.r*Math.cos(s.pitch)*Math.sin(s.yaw), target.y + s.r*Math.sin(s.pitch), target.z + s.r*Math.cos(s.pitch)*Math.cos(s.yaw)); cam.lookAt(target); }
  canvas.addEventListener('pointerdown', e=>{ s.drag=true; s.lx=e.clientX; s.ly=e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup', ()=>{ s.drag=false; });
  canvas.addEventListener('pointermove', e=>{ if(!s.drag) return; s.yaw -= (e.clientX-s.lx)*0.008; s.pitch = Math.max(-0.1, Math.min(1.3, s.pitch + (e.clientY-s.ly)*0.006)); s.lx=e.clientX; s.ly=e.clientY; apply(); });
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); s.r = Math.max(1.2, Math.min(24, s.r * (1 + e.deltaY*0.001))); apply(); }, {passive:false});
  apply(); return { apply, s };
}
function evalChannel(keys, t){
  if (!keys.length) return null;
  if (t <= keys[0].t) return keys[0].v;
  for (let i=0;i<keys.length-1;i++){ const a=keys[i], b=keys[i+1];
    if (t >= a.t && t < b.t){ if (a.i === 'step') return a.v; const f = (t-a.t)/Math.max(1e-6,(b.t-a.t)); return a.v.map((x,k)=> x + (b.v[k]-x)*f); } }
  return keys[keys.length-1].v;
}
function applyClip(rig, tickF){
 const t=Math.max(0,Math.min(80,tickF)),i=Math.floor(t),f=t-i,a=NATIVE[i],b=NATIVE[Math.min(80,i+1)];
 for(const [n,g] of Object.entries(rig.bones)){
  const x=a[n],y=b[n];if(!x)continue;
  g.position.set(...x.p.map((v,k)=>(v+(y.p[k]-v)*f)*U));
  g.quaternion.fromArray(x.q).slerp(new THREE.Quaternion().fromArray(y.q),f);
  g.scale.set(...x.s.map((v,k)=>v+(y.s[k]-v)*f));
 }
}
const tint=document.createElement('select');
for(const [label,color] of [['Red','#FF3A1A'],['Orange','#FF8A1A'],['Yellow','#FFE14A'],['White','#FFFFFF'],['Blue','#6AD8FF']]){const o=document.createElement('option');o.value=color;o.textContent=label+' '+color;tint.appendChild(o);}tint.value='#FFFFFF';
const tintLabel=document.createElement('label');tintLabel.textContent='Tint ';tintLabel.appendChild(tint);document.getElementById('controls').appendChild(tintLabel);
tint.onchange=()=>{for(const l of lanes)l.rig.root.traverse(o=>{if(o.isMesh)o.material.color.set(tint.value);});};
function lerpArr(arr, tf){ const i=Math.floor(tf), f=tf-i; if (i>=arr.length-1) return arr[arr.length-1]; return arr[i]+(arr[i+1]-arr[i])*f; }

// ---------- clip tab: one lane per rig ----------
const c1 = document.getElementById('c1');
const r1 = new THREE.WebGLRenderer({canvas:c1, antialias:true}); r1.setPixelRatio(Math.min(2, devicePixelRatio)); r1.setClearColor(0x0E0B08); r1.setScissorTest(true);
const lanesEl = document.getElementById('lanes'); lanesEl.style.gridTemplateColumns = `repeat(${D.rigs.length},1fr)`;
const lanes = D.rigs.map(r => {
  const scene = new THREE.Scene(); dress(scene);
  scene.add(mannequin(0xC9B7A2, 0x6B6E75, 0x3D3F45));

  const rig = buildRig(r.data); rig.root.position.y = D.chest; scene.add(rig.root);
  const label = document.createElement('div'); label.textContent = r.label; lanesEl.appendChild(label);
  return { scene, rig, cam: new THREE.PerspectiveCamera(38, 1, 0.05, 100) };
});
const orb = orbit(c1, lanes[0].cam, new THREE.Vector3(0, 1.125, 0), Math.hypot(6,.475), Math.PI, Math.atan2(.475,6));
let tick = 0, playing = true, speed = 1, loop = true, last = performance.now();
document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; };
document.getElementById('speed').onchange = e => speed = parseFloat(e.target.value);
document.getElementById('loop').onchange = e => loop = e.target.checked;
scrub.oninput = e => { tick = parseFloat(e.target.value); playing = false; document.getElementById('play').textContent = 'Play'; };
function renderClip(now){
  const dt = (now - last)/1000; last = now;
  if (playing){ tick += dt * TPS * speed; if (tick >= LEN_T){ if (loop) tick %= LEN_T; else { tick = LEN_T; playing = false; document.getElementById('play').textContent='Play'; } } }
  const tk = Math.min(LEN_T, tick);
  scrub.value = tk.toFixed(2); document.getElementById('tickout').innerHTML = 't ' + tk.toFixed(1) + '<small>' + Math.round(tk*1000/TPS) + ' ms</small>';
  for (const l of lanes){ applyClip(l.rig, tick); l.rig.root.position.z = D.drive ? -lerpArr(D.drive, tick) : 0; l.rig.root.visible = tick < LEN_T || !D.drive; }
  highlightTick(Math.min(LEN_T, Math.floor(tick)));
  const w = c1.clientWidth, h = c1.clientHeight; if (c1.width !== Math.floor(w*r1.getPixelRatio())) r1.setSize(w, h, false);
  const lw = Math.floor(w / lanes.length);
  lanes.forEach((l, i) => { l.cam.aspect = lw/h; l.cam.position.copy(lanes[0].cam.position); l.cam.quaternion.copy(lanes[0].cam.quaternion); l.cam.updateProjectionMatrix();
    r1.setViewport(i*lw,0,lw,h); r1.setScissor(i*lw,0,lw,h); r1.render(l.scene, l.cam); });
}

// ---------- timeline: every animated bone's scale x per tick, plus the drive ----------
(function buildTable(){
  const ticks = [...Array(LEN_T+1).keys()];
  let html = '<thead><tr><th>tick</th>' + ticks.map(t=>'<th>'+t+'</th>').join('') + '</tr></thead><tbody>';
  const row = (label, cells) => '<tr><td>'+label+'</td>' + cells.map(c=>'<td class="tc'+(c==='hidden'?' hid':'')+'">'+c+'</td>').join('') + '</tr>';
  for (const r of D.rigs){
    const anim = r.data.anims[CLIP]; if (!anim) continue;
    for (const [bone, keys] of Object.entries(anim.bones)){
      const sk = keys.filter(k=>k.ch==='rotation'); if (!sk.length) continue;
      html += row(`<b>${r.label}</b> · ${bone} rotation z`, ticks.map(t => { const v = evalChannel(sk, t/TPS)[2]; return v.toFixed(1)+'°'; }));
    }
  }
  if (D.drive) html += row('hook drive z (blocks, 0 = chest)', ticks.map(t => { const v = D.drive[Math.min(t, D.drive.length-1)]; return (v>0?'+':'')+v.toFixed(2); }));
  document.getElementById('tltable').innerHTML = html + '</tbody>';
})();
function highlightTick(i){
  document.querySelectorAll('#tltable td.tc').forEach(td => td.classList.remove('hl'));
  document.querySelectorAll('#tltable tbody tr').forEach(tr => { const td = tr.children[i+1]; if (td) td.classList.add('hl'); });
}

// ---------- turnaround: first rig at rest; one button per leaf animated bone (layers, frames) ----------
const c3 = document.getElementById('c3');
const r3 = new THREE.WebGLRenderer({canvas:c3, antialias:true}); r3.setPixelRatio(Math.min(2, devicePixelRatio)); r3.setClearColor(0x0E0B08);
const sceneT = new THREE.Scene(); dress(sceneT);
const rigT = buildRig(D.rigs[0].data); rigT.root.position.y = D.chest; sceneT.add(rigT.root);
const camT = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
const orbT = orbit(c3, camT, new THREE.Vector3(0, 1.2, 0), 4.6, 0.6, 0.25);
const animT = rigT.data.anims[CLIP] || {bones:{}};
const animated = Object.keys(animT.bones).filter(n => rigT.bones[n]);
const leafAnimated = animated.filter(n => { let hasAnimatedChild = false; rigT.bones[n].traverse(o => { if (o !== rigT.bones[n] && animated.includes(o.name)) hasAnimatedChild = true; }); return !hasAnimatedChild; });
let shown = leafAnimated[leafAnimated.length-1] || null;
const tc = document.getElementById('turnControls');
if (false){
  const lab = document.createElement('span'); lab.style.cssText = 'font:400 12px var(--mono);color:var(--ink-dim)'; lab.textContent = 'show'; tc.appendChild(lab);
  for (const n of leafAnimated){ const b = document.createElement('button'); b.textContent = n; b.setAttribute('aria-pressed', String(n===shown));
    b.onclick = () => { shown = n; tc.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x===b))); }; tc.appendChild(b); }
}
const spin = document.getElementById('spin');
function renderTurn(){
  for (const n of animated) rigT.bones[n].scale.setScalar(1);

  if (spin.checked && !orbT.s.drag){ orbT.s.yaw += 0.006; orbT.apply(); }
  const w = c3.clientWidth, h = c3.clientHeight; if (c3.width !== Math.floor(w*r3.getPixelRatio())) r3.setSize(w, h, false);
  camT.aspect = w/h; camT.updateProjectionMatrix(); r3.render(sceneT, camT);
}

// ---------- tabs ----------
let active = 'clip';
document.querySelectorAll('nav [role=tab]').forEach(b => b.onclick = () => { active = b.dataset.tab;
  document.querySelectorAll('nav [role=tab]').forEach(x => x.setAttribute('aria-selected', String(x===b)));
  for (const t of ['clip','turn']) document.getElementById('tab-'+t).hidden = active !== t; last = performance.now(); });
if (matchMedia('(prefers-reduced-motion: reduce)').matches){ playing = false; document.getElementById('play').textContent = 'Play'; spin.checked = false; }
(function frame(now){ if (active === 'clip') renderClip(now); else renderTurn(); requestAnimationFrame(frame); })(performance.now());
</script>
